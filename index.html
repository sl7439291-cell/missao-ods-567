<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>Missão ODS 5</title><style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#dff6e4,#b7e4c7)}.container{max-width:700px;margin:30px auto;background:#fff;padding:20px;border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.2)}h1{color:#1b5e20;text-align:center}#barra{width:100%;height:10px;background:#ddd;border-radius:20px;overflow:hidden}#progresso{height:100%;width:0;background:#2e7d32}button{width:100%;padding:12px;margin:8px 0;border:none;border-radius:10px;cursor:pointer;font-size:16px}.opcao{background:#eef7ee}#proximo{background:#2e7d32;color:#fff;display:none}#feedback{font-weight:bold}</style></head><body><div class='container'><h1>🌍 Missão ODS 5</h1><p>Conquiste os 5 Objetivos de Desenvolvimento Sustentável!</p><div id='barra'><div id='progresso'></div></div><h2 id='titulo'></h2><p id='pergunta'></p><div id='opcoes'></div><p id='feedback'></p><button id='proximo'>Próxima missão</button></div><script>const fases=[{titulo:'🍎 ODS 2 – Fome Zero',pergunta:'Qual atitude ajuda a reduzir a fome?',opcoes:['Desperdiçar comida','Aproveitar melhor os alimentos','Jogar comida fora'],correta:1},{titulo:'📚 ODS 4 – Educação de Qualidade',pergunta:'O que fortalece esse objetivo?',opcoes:['Impedir crianças de estudar','Acesso à educação','Abandonar a escola'],correta:1},{titulo:'💧 ODS 6 – Água Potável',pergunta:'Como economizar água?',opcoes:['Fechar a torneira ao escovar os dentes','Lavar calçada com mangueira','Deixar a torneira aberta'],correta:0},{titulo:'🌱 ODS 13 – Ação Climática',pergunta:'Qual atitude ajuda o clima?',opcoes:['Queimar lixo','Usar bicicleta','Desmatar'],correta:1},{titulo:'🌳 ODS 15 – Vida Terrestre',pergunta:'O que protege a natureza?',opcoes:['Plantar árvores','Poluir rios','Desmatar'],correta:0}];let atual=0,pontos=0;const titulo=document.getElementById('titulo'),pergunta=document.getElementById('pergunta'),opcoes=document.getElementById('opcoes'),feedback=document.getElementById('feedback'),proximo=document.getElementById('proximo'),barra=document.getElementById('progresso');function mostrar(){barra.style.width=atual/fases.length*100+'%';feedback.textContent='';proximo.style.display='none';opcoes.innerHTML='';titulo.textContent=fases[atual].titulo;pergunta.textContent=fases[atual].pergunta;fases[atual].opcoes.forEach((texto,i)=>{const b=document.createElement('button');b.className='opcao';b.textContent=texto;b.onclick=()=>responder(i);opcoes.appendChild(b);});}function responder(i){document.querySelectorAll('.opcao').forEach(b=>b.disabled=true);if(i===fases[atual].correta){pontos++;feedback.innerHTML='✅ Correto!';feedback.style.color='green';}else{feedback.innerHTML='❌ Correto: <b>'+fases[atual].opcoes[fases[atual].correta]+'</b>';feedback.style.color='red';}proximo.style.display='block';}proximo.onclick=()=>{atual++;if(atual<fases.length)mostrar();else fim();};function fim(){barra.style.width='100%';document.querySelector('.container').innerHTML=`<h1>🏆 Missão Concluída!</h1><h2>Você acertou ${pontos}/5.</h2><p>Cada pequena atitude ajuda a construir um mundo mais sustentável.</p><button onclick='location.reload()'>Jogar Novamente</button>`;}mostrar();</script></body></html>
